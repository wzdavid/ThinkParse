# Multi-GPU worker template (optional override)
#
# Default docker-compose.yml runs ONE mineru-worker-gpu that sees all GPUs
# (count: all) but typically only uses cuda:0. This file adds one Celery
# worker per GPU so bulk queues can use multiple cards in parallel.
#
# Usage (from docker/):
#   1. Do NOT enable profile "mineru-gpu" (single shared worker).
#   2. Enable one profile per card you want, e.g. mineru-gpu-0,mineru-gpu-1
#
# Example — 2 GPUs + Redis:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.multi-gpu.yml
#   COMPOSE_PROFILES=redis,mineru-gpu-0,mineru-gpu-1
#   docker compose up -d
#
# Or one-shot:
#   docker compose -f docker-compose.yml -f docker-compose.multi-gpu.yml \
#     --profile redis --profile mineru-gpu-0 --profile mineru-gpu-1 up -d
#
# Optional env (docker/.env):
#   GPU_WORKER_CONCURRENCY=1   # keep 1 per card unless you know VRAM headroom
#
# Template includes GPU 0–7. Enable only the profiles that match installed cards.
# To add GPU 8+, copy a service block and bump the index.
#
# device_ids selects the physical card and the NVIDIA runtime remaps it to
# index 0 inside the container. CUDA_VISIBLE_DEVICES must stay 0 on every
# worker. Setting it to the host index (1, 2, ...) hides the only visible GPU.
#
# Dedicated GPU host in a multi-node cluster (no local API/cleanup):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.multi-gpu.yml:docker-compose.worker-only.yml
#   COMPOSE_PROFILES=mineru-gpu-0,mineru-gpu-1

x-mineru-gpu-worker: &mineru-gpu-worker
  image: mineru-worker:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile.worker
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  restart: always
  depends_on:
    redis:
      condition: service_healthy
      required: false
  env_file:
    - ../.env
  volumes:
    - mineru_output:/tmp/mineru_output
    - mineru_temp:/tmp/mineru_temp
    - ../worker:/app/worker
    - ../shared:/app/shared
  networks:
    - mineru-network

services:
  mineru-worker-gpu-0:
    <<: *mineru-gpu-worker
    profiles: ["mineru-gpu-0"]
    container_name: mineru-worker-gpu-0
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}
      - CUDA_VISIBLE_DEVICES=0
      - WORKER_NAME=mineru-gpu-0
      - WORKER_CONCURRENCY=${GPU_WORKER_CONCURRENCY:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  mineru-worker-gpu-1:
    <<: *mineru-gpu-worker
    profiles: ["mineru-gpu-1"]
    container_name: mineru-worker-gpu-1
    environment:
