# Legacy one-worker-per-card template.
#
# Prefer docker/gpu-up.sh. It writes docker-compose.gpus.yml from
# MINERU_GPU_COUNT and MINERU_WORKERS_PER_GPU, so several engines can share
# one card without copying service blocks.
#
#   cd docker && sh gpu-up.sh
#
# This file remains for hosts already started with profiles mineru-gpu-0 …
# mineru-gpu-7 (one container each). Do not run it together with gpu-up.sh:
# both sets consume the same Celery queue.
#
# Do NOT enable profile "mineru-gpu" (single shared worker, usually cuda:0).
#
# Example — 2 GPUs + Redis:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.multi-gpu.yml
#   COMPOSE_PROFILES=redis,mineru-gpu-0,mineru-gpu-1
#   GPU_WORKER_CONCURRENCY=1
#   docker compose up -d
#
# device_ids selects the physical card and the NVIDIA runtime remaps it to
# index 0 inside the container. CUDA_VISIBLE_DEVICES must stay 0 on every
# worker. Setting it to the host index (1, 2, ...) hides the only visible GPU.
#
# Dedicated GPU host (no local API/cleanup):
#   MINERU_GPU_WORKER_ONLY=1 sh gpu-up.sh
#   # or, with this legacy file:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.multi-gpu.yml:docker-compose.worker-only.yml
#   COMPOSE_PROFILES=mineru-gpu-0,mineru-gpu-1

x-mineru-gpu-worker: &mineru-gpu-worker
  image: mineru-worker:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile.worker
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  restart: always
  depends_on:
    redis:
      condition: service_healthy
      required: false
  env_file:
    - ../.env
  volumes:
    - mineru_output:/tmp/mineru_output
    - mineru_temp:/tmp/mineru_temp
    - ../worker:/app/worker
    - ../shared:/app/shared
  networks:
    - mineru-network

services:
  mineru-worker-gpu-0:
    <<: *mineru-gpu-worker
    profiles: ["mineru-gpu-0"]
    container_name: mineru-worker-gpu-0
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}
      - CUDA_VISIBLE_DEVICES=0
      - WORKER_NAME=mineru-gpu-0
      - WORKER_CONCURRENCY=${GPU_WORKER_CONCURRENCY:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  mineru-worker-gpu-1:
    <<: *mineru-gpu-worker
    profiles: ["mineru-gpu-1"]
    container_name: mineru-worker-gpu-1
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}
