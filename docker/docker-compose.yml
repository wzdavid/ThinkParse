# ThinkParse. The gateway publishes 8000, which is the port ThinkExtract already uses.
# Enable at most one engine profile: cpu or gpu. With neither, set MINERU_BASE_URL
# (or MINERU_BASE_URLS) to an existing MinerU 4.0 service.
# One GPU: the gpu profile publishes mineru-router:8002.
# Two GPUs: also enable the gpu1 profile. Each container sees one card
# (mineru-gpu0:8002 and mineru-gpu1:8002). A single Router will not spread
# one ThinkParse reconciler across cards. MinerU is not published on the host.
# ThinkParse does not load CUDA.
# Objects default to the shared local volume. Set THINKPARSE_S3_ENDPOINT for an external S3.

name: thinkparse

x-control-env: &control-env
  THINKPARSE_DATABASE_URL: postgresql://${POSTGRES_USER:-thinkparse}:${POSTGRES_PASSWORD:-thinkparse}@postgres:5432/${POSTGRES_DB:-thinkparse}
  THINKPARSE_OBJECT_DIR: /var/lib/thinkparse/objects
  THINKPARSE_S3_ENDPOINT: ${THINKPARSE_S3_ENDPOINT:-}
  THINKPARSE_S3_ACCESS_KEY: ${THINKPARSE_S3_ACCESS_KEY:-}
  THINKPARSE_S3_SECRET_KEY: ${THINKPARSE_S3_SECRET_KEY:-}
  THINKPARSE_S3_BUCKET: ${THINKPARSE_S3_BUCKET:-thinkparse}
  THINKPARSE_REQUIRE_POSTGRES: "1"
  DOCLING_BASE_URL: ${DOCLING_BASE_URL:-}
  MINERU_BASE_URL: ${MINERU_BASE_URL:-http://mineru-router:8002}
  MINERU_BASE_URLS: ${MINERU_BASE_URLS:-}
  MINERU_API_KEY: ${MINERU_API_KEY:-}
  THINKPARSE_API_KEY: ${THINKPARSE_API_KEY:-}
  THINKPARSE_MAX_INFLIGHT: ${THINKPARSE_MAX_INFLIGHT:-4}
  THINKPARSE_SLOTS: ${THINKPARSE_SLOTS:-}
  THINKPARSE_INFLIGHT_BYTE_LIMIT: ${THINKPARSE_INFLIGHT_BYTE_LIMIT:-1073741824}
  THINKPARSE_ACCEPTED_TIERS: ${THINKPARSE_ACCEPTED_TIERS:-}
  LEGACY_ALLOW_FLASH: ${LEGACY_ALLOW_FLASH:-false}

x-control-volumes: &control-volumes
  - thinkparse_objects:/var/lib/thinkparse/objects

x-control-depends: &control-depends
  postgres:
    condition: service_healthy
  mineru-cpu:
    condition: service_healthy
    required: false
  mineru-gpu0:
    condition: service_healthy
    required: false
  mineru-gpu1:
    condition: service_healthy
    required: false

x-mineru-env: &mineru-env
  MINERU_MODEL_SOURCE: local
  MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-8}
  MINERU_PDF_RENDER_THREADS: ${MINERU_PDF_RENDER_THREADS:-1}
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  # Delete MinerU scratch files the client did not release. 0 keeps them until process exit.
  MINERU_FILE_RETENTION_SECONDS: ${MINERU_FILE_RETENTION_SECONDS:-21600}

x-mineru-health: &mineru-health
  test: ["CMD-SHELL", "curl -f http://localhost:8002/v1/health || exit 1"]
  interval: 15s
  timeout: 10s
  retries: 40
  start_period: 600s

x-mineru-gpu: &mineru-gpu
  build:
    context: .
    dockerfile: mineru.Dockerfile
    args:
      MINERU_VERSION: ${MINERU_VERSION:-4.0.10}
      MINERU_GPU_TIER: ${MINERU_GPU_TIER:-standard}
      MINERU_DOWNLOAD_SOURCE: ${MINERU_DOWNLOAD_SOURCE:-modelscope}
      VLLM_BASE_IMAGE: ${MINERU_GPU_BASE_IMAGE:-vllm/vllm-openai:v0.21.0}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: thinkparse-mineru:${MINERU_VERSION:-4.0.10}-gpu-${MINERU_GPU_TIER:-standard}
  shm_size: ${MINERU_SHM_SIZE:-32gb}
  ipc: host
  entrypoint: ["mineru-kit"]
  command:
    - router
    - --host
    - 0.0.0.0
    - --port
    - "8002"
    - --local-gpus
    - auto
    - --worker-tier
    - ${MINERU_GPU_TIER:-standard}
    - --worker-concurrency
    - ${MINERU_GPU_CONCURRENCY:-2}
    - --preload-models
  ulimits:
    memlock: -1
    stack: 67108864
  healthcheck: *mineru-health

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thinkparse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkparse}
      POSTGRES_DB: ${POSTGRES_DB:-thinkparse}
    volumes:
      - thinkparse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thinkparse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mineru-cpu:
    # Shared with the other engine profile so both cannot run at once.
    container_name: thinkparse-mineru
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: mineru-cpu.Dockerfile
      args:
        MINERU_VERSION: ${MINERU_VERSION:-4.0.10}
        MINERU_DOWNLOAD_SOURCE: ${MINERU_DOWNLOAD_SOURCE:-modelscope}
        CPU_BASE_IMAGE: ${MINERU_CPU_BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: thinkparse-mineru:${MINERU_VERSION:-4.0.10}-cpu
    environment:
      <<: *mineru-env
      MINERU_MODEL_SMALL_BACKEND: onnx
    command:
      - router
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --local-gpus
      - auto
      - --worker-tier
      - basic
      - --worker-concurrency
      - ${MINERU_CPU_CONCURRENCY:-1}
      - --preload-models
    healthcheck: *mineru-health
    networks:
      default:
        aliases:
          - mineru-router

  mineru-gpu0:
    # Same container name as the cpu profile so both cannot run at once.
    <<: *mineru-gpu
    container_name: thinkparse-mineru
    profiles: ["gpu"]
    environment:
      <<: *mineru-env
      NVIDIA_VISIBLE_DEVICES: "0"
    networks:
      default:
        aliases:
          - mineru-gpu0
          - mineru-router
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  mineru-gpu1:
    <<: *mineru-gpu
    container_name: thinkparse-mineru-1
    profiles: ["gpu1"]
    environment:
      <<: *mineru-env
      NVIDIA_VISIBLE_DEVICES: "1"
    networks:
      default:
        aliases:
          - mineru-gpu1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  gateway:
    build:
      context: ..
      dockerfile: control/Dockerfile
      args:
        CONTROL_BASE_IMAGE: ${CONTROL_BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: thinkparse-control:2.0
    environment:
      <<: *control-env
      API_PORT: "8000"
    ports:
      - "${THINKPARSE_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *control-volumes
    depends_on: *control-depends
    restart: unless-stopped
    command: ["python", "-m", "control.gateway"]

  reconciler:
    image: thinkparse-control:2.0
    environment:
      <<: *control-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *control-volumes
    depends_on: *control-depends
    restart: unless-stopped
    command: ["python", "-m", "control.reconciler"]

volumes:
  thinkparse_pg:
  thinkparse_objects:
