name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

jobs:
  test:
    name: Control plane tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r control/requirements-dev.txt

      - name: Test and lint
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_control_*.py'
          ruff check control tests

  docker-build:
    name: Control plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./control/Dockerfile
          push: false
          tags: thinkparse-control:test
