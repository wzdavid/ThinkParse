[project]
name = "think-parse"
version = "2.0.0"
description = "Enterprise document parsing system — multi-GPU, distributed, batch-ready"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ThinkParse Contributors"}
]
keywords = ["document-parsing", "thinkparse", "mineru", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/wzdavid/ThinkParse"
Documentation = "https://github.com/wzdavid/ThinkParse#readme"
Repository = "https://github.com/wzdavid/ThinkParse"
Issues = "https://github.com/wzdavid/ThinkParse/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
